name: Trading Agent Scanner

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas: 0, 6, 12, 18 UTC
  workflow_dispatch:          # permite dispararlo manualmente desde GitHub

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests anthropic numpy python-dotenv python-telegram-bot==21.5

      - name: Correr scanner
        run: python scanner.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          LUNARCRUSH_API_KEY:   ${{ secrets.LUNARCRUSH_API_KEY }}
